name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only trusted humans may invoke the model. Bots and forks are ignored.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          mentions: /opencode,/oc
          share: 'true'

  triage:
    # Incoming issues only. Tickets from to-tickets carry ready-for-agent and are skipped.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: 'true'
          prompt: |
            Это новое входящее обращение, а не готовый тикет. Проведи предварительный разбор по скиллу `triage` из `.agents/skills/triage/SKILL.md`.
            Прочитай описание issue, `AGENTS.md`, `docs/agents/triage-labels.md`, `docs/agents/issue-tracker.md` и код репозитория, чтобы понять, что приложение уже умеет.
            Определи категорию и состояние триажа. Если условий не хватает, оставь конкретные вопросы автору и поставь метку `needs-info`. Если данных достаточно, опубликуй agent brief и примени категорию и финальную метку из `docs/agents/triage-labels.md`.
            Каждый комментарий начинай с дисклеймера скилла: > *This was generated by AI during triage.*
            Не меняй код, не публикуй спецификацию и не создавай тикеты. Не исследуй внутренние пути раннера и экшена (`/home/runner`, `/github/workflow`, `GITHUB_ACTION_PATH`) — читай только репозиторий и issue через `gh`.
