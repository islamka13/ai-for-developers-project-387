name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only trusted humans may invoke the model. Bots and forks are ignored.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name != 'pull_request_review_comment' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # The counter lives in Actions history, which the agent token can only read.
      # Every comment request, rerun and timed-out attempt consumes one slot.
      - name: Check PR request budget
        id: budget
        if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment'
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          result-encoding: string
          script: |
            const prNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const { owner, repo } = context.repo;
            const limit = 3;
            const current = context.payload.pull_request
              ? { data: context.payload.pull_request }
              : await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, workflow_id: 'opencode.yml', per_page: 100,
            });
            const prior = runs.filter((run) =>
              run.id !== context.runId &&
              (run.event === 'issue_comment' || run.event === 'pull_request_review_comment') &&
              (run.pull_requests || []).some((pr) => pr.number === prNumber));
            const attempts = prior.reduce((sum, run) => sum + (run.run_attempt || 1), 0) + Number(process.env.RUN_ATTEMPT || 1);
            const allowed = attempts <= limit;
            core.setOutput('allowed', String(allowed));
            core.setOutput('attempts', String(attempts));
            core.setOutput('limit', String(limit));
            core.setOutput('head_sha', current.data.head.sha);
            core.info(`PR #${prNumber}: attempt ${attempts}/${limit}, allowed=${allowed}`);

      - name: Run OpenCode
        id: agent
        if: steps.budget.outputs.allowed != 'false'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          mentions: /opencode,/oc
          share: 'true'

      - name: Report stopped run
        if: >-
          always() && (github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment') &&
          (steps.budget.outcome == 'failure' || steps.budget.outputs.allowed == 'false' ||
           steps.agent.outcome == 'failure' || steps.agent.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPTS: ${{ steps.budget.outputs.attempts }}
          LIMIT: ${{ steps.budget.outputs.limit }}
          HEAD_SHA: ${{ steps.budget.outputs.head_sha }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ATTEMPTS" -gt "$LIMIT" ] 2>/dev/null; then
            REASON='limit_exhausted'
          elif [ "$AGENT_OUTCOME" = 'cancelled' ]; then
            REASON='timeout'
          elif [ "$BUDGET_OUTCOME" = 'failure' ]; then
            REASON='infra'
          else
            REASON='agent_failed'
          fi
          {
            echo "### OpenCode: нужен человек"
            echo
            echo "Причина: \`$REASON\`."
            echo "Попытка: ${ATTEMPTS:-n/a} из ${LIMIT:-n/a}."
            echo "Последний HEAD PR: \`$HEAD_SHA\`."
            echo "Логи: $RUN_URL"
          } > report.md
          gh pr comment "${{ github.event.issue.number || github.event.pull_request.number }}" --body-file report.md

  triage:
    # Incoming issues only. Tickets from to-tickets carry ready-for-agent and are skipped.
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: 'true'
          prompt: |
            Это новое входящее обращение, а не готовый тикет. Проведи предварительный разбор по скиллу `triage` из `.agents/skills/triage/SKILL.md`.
            Прочитай описание issue, `AGENTS.md`, `docs/agents/triage-labels.md`, `docs/agents/issue-tracker.md` и код репозитория, чтобы понять, что приложение уже умеет.
            Определи категорию и состояние триажа. Если условий не хватает, оставь конкретные вопросы автору и поставь метку `needs-info`. Если данных достаточно, опубликуй agent brief и примени категорию и финальную метку из `docs/agents/triage-labels.md`.
            Каждый комментарий начинай с дисклеймера скилла: > *This was generated by AI during triage.*
            Не меняй код, не публикуй спецификацию и не создавай тикеты. Не исследуй внутренние пути раннера и экшена (`/home/runner`, `/github/workflow`, `GITHUB_ACTION_PATH`) — читай только репозиторий и issue через `gh`.
