openapi: 3.0.0
info:
  title: Запись на звонок API
  version: 0.0.0
tags: []
paths:
  /api/bookings:
    get:
      operationId: Bookings_listBookings
      description: Предстоящие встречи владельца.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingBookingList'
    post:
      operationId: Bookings_createBooking
      description: Занять свободный слот (гость).
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBooking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
  /api/event-types:
    get:
      operationId: EventTypes_listEventTypes
      description: Список типов встреч.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeList'
    post:
      operationId: EventTypes_createEventType
      description: Создать тип встречи (владелец).
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /api/event-types/{id}/slots:
    get:
      operationId: EventTypes_listSlots
      description: Свободные слоты типа встречи на дату (дата в зоне владельца).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          description: Дата в формате YYYY-MM-DD (зона владельца).
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      operationId: Health_check
      description: Проверка живости сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
      description: 'Единая форма ошибки: код, сообщение и необязательные детали по полям.'
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - start
        - guestName
      properties:
        id:
          type: string
          description: Идентификатор генерирует сервер.
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: 'Старт слота: ISO 8601 с offset зоны владельца.'
        guestName:
          type: string
          minLength: 1
        topic:
          type: string
          maxLength: 200
          description: Тема разговора гостя, до 200 символов.
      description: 'Бронирование: слот, занятый гостем.'
    CreateBooking:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: 'Старт слота: ISO 8601 с offset зоны владельца.'
        guestName:
          type: string
          minLength: 1
        topic:
          type: string
          maxLength: 200
          description: Тема разговора гостя, до 200 символов.
      description: Данные для создания бронирования гостем.
    CreateEventType:
      type: object
      required:
        - title
        - description
        - durationMinutes
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 540
      description: Данные для создания типа встречи владельцем.
    CreatedBooking:
      type: object
      required:
        - booking
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
      description: Созданное бронирование.
    CreatedEventType:
      type: object
      required:
        - eventType
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
      description: Созданный тип встречи.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: Идентификатор генерирует сервер.
        title:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 540
      description: 'Тип встречи: название, описание и длительность в минутах.'
    EventTypeList:
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
      description: Каталог типов встреч.
    EventTypeSummary:
      type: object
      required:
        - id
        - title
        - durationMinutes
      properties:
        id:
          type: string
        title:
          type: string
        durationMinutes:
          type: integer
          format: int32
      description: Краткая сводка типа встречи, вложенная в бронирование владельцу.
    SlotList:
      type: object
      required:
        - slots
      properties:
        slots:
          type: array
          items:
            type: string
      description: Свободные старты слотов на дату (ISO 8601 с offset зоны владельца).
    UpcomingBooking:
      type: object
      required:
        - id
        - eventTypeId
        - start
        - guestName
        - eventType
      properties:
        id:
          type: string
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: 'Старт слота: ISO 8601 с offset зоны владельца.'
        guestName:
          type: string
        topic:
          type: string
          maxLength: 200
          description: Тема разговора гостя, до 200 символов.
        eventType:
          $ref: '#/components/schemas/EventTypeSummary'
      description: Бронирование с данными типа встречи для страницы владельца.
    UpcomingBookingList:
      type: object
      required:
        - bookings
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingBooking'
      description: Список предстоящих встреч владельца.
servers:
  - url: http://localhost:3000
    description: dev server
    variables: {}
